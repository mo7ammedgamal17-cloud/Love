<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammed Gamal</title>
<style>
:root{--bg:#fff0f3;--card:#ffffff;--text:#4a1530;--love:#e11d48;--love-text:#ffffff;--no:#e5e7eb;--no-text:#374151;--shadow:rgba(225,29,72,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0b14;--card:#2a1220;--text:#ffe4ec;--love:#fb4f78;--love-text:#2a0612;--no:#3b2a33;--no-text:#f3e8ee;--shadow:rgba(251,79,120,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c0b14;--card:#2a1220;--text:#ffe4ec;--love:#fb4f78;--love-text:#2a0612;--no:#3b2a33;--no-text:#f3e8ee;--shadow:rgba(251,79,120,.25);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{background:var(--card);border-radius:28px;padding:36px 24px;width:min(90%,420px);text-align:center;box-shadow:0 12px 40px var(--shadow)}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px;margin-bottom:14px;color:var(--love);direction:ltr}
.big{font-size:64px;line-height:1;animation:beat 1.2s infinite}
h1{font-size:28px;margin:16px 0 28px}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:56px}
button{font:inherit;font-size:18px;font-weight:700;border:0;border-radius:999px;padding:14px 26px;cursor:pointer}
#yes{background:var(--love);color:var(--love-text);box-shadow:0 6px 18px var(--shadow)}
#yes:active{transform:scale(.96)}
#no{background:var(--no);color:var(--no-text);transition:left .25s ease,top .25s ease}
#msg{display:none}
#msg h2{font-size:30px;margin:12px 0 0}
.heart{position:fixed;bottom:-40px;font-size:28px;animation:up 3s linear forwards;pointer-events:none}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes up{to{transform:translateY(-110vh) rotate(30deg);opacity:.2}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Mohammed Gamal</div>
  <div id="ask">
    <div class="big">💖</div>
    <h1>بتحبني ولا مبتحبنيش؟</h1>
    <div class="row">
      <button id="yes">بحبك ❤️</button>
      <button id="no">مبتحبنيش</button>
    </div>
  </div>
  <div id="msg">
    <div class="big">🥰</div>
    <h2>وأنا كمان بحبك ❤️</h2>
  </div>
</div>
<script>
var no=document.getElementById('no'),yes=document.getElementById('yes');
function run(e){
  if(e&&e.preventDefault)e.preventDefault();
  no.style.position='fixed';
  var w=no.offsetWidth,h=no.offsetHeight,pad=12;
  var x=pad+Math.random()*(window.innerWidth-w-pad*2);
  var y=pad+Math.random()*(window.innerHeight-h-pad*2);
  no.style.left=x+'px';no.style.top=y+'px';
}
['mouseover','pointerenter','touchstart','pointerdown','click','focus'].forEach(function(ev){no.addEventListener(ev,run,{passive:false})});
function hearts(){
  var em=['❤️','💖','💕','💗','😍'];
  for(var i=0;i<40;i++){
    (function(i){setTimeout(function(){
      var s=document.createElement('span');s.className='heart';
      s.textContent=em[Math.floor(Math.random()*em.length)];
      s.style.left=Math.random()*95+'vw';
      s.style.fontSize=(20+Math.random()*28)+'px';
      document.body.appendChild(s);
      setTimeout(function(){s.remove()},3200);
    },i*90)})(i);
  }
}
yes.addEventListener('click',function(){
  document.getElementById('ask').style.display='none';
  no.style.display='none';
  document.getElementById('msg').style.display='block';
  hearts();
});
</script>
</body>
</html>
